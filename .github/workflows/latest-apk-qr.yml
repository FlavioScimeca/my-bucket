name: Latest APK link + QR

# Manual only — prints the stable per-app download URL and QR code.
#
# Keep `app_slug.options` in sync with `.github/app-slugs.txt`
# (GitHub cannot populate choice options from a file at form time).
on:
  workflow_dispatch:
    inputs:
      app_slug:
        description: App slot / rolling release tag (must also be in .github/app-slugs.txt)
        required: true
        default: vyrel
        type: choice
        options:
          - vyrel
          - placeholder-app

permissions:
  contents: read

jobs:
  show-latest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app-slugs registry
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/app-slugs.txt
          sparse-checkout-cone-mode: false

      - name: Resolve per-app download URL
        id: latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          APP_SLUG: ${{ inputs.app_slug }}
        run: |
          set -euo pipefail

          if [[ ! "$APP_SLUG" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::Invalid app_slug: $APP_SLUG"
            exit 1
          fi

          mapfile -t ALLOWED < <(
            grep -E '^[a-z][a-z0-9-]*$' .github/app-slugs.txt || true
          )

          if [[ ${#ALLOWED[@]} -eq 0 ]]; then
            echo "::error::No allowed slugs found in .github/app-slugs.txt"
            exit 1
          fi

          allowed=false
          for slug in "${ALLOWED[@]}"; do
            if [[ "$slug" == "$APP_SLUG" ]]; then
              allowed=true
              break
            fi
          done

          if [[ "$allowed" != "true" ]]; then
            echo "::error::app_slug '$APP_SLUG' is not in .github/app-slugs.txt"
            printf 'Allowed:\n'
            printf '  - %s\n' "${ALLOWED[@]}"
            exit 1
          fi

          APK_NAME="${APP_SLUG}-dev-app.apk"
          DOWNLOAD_URL="https://github.com/${REPO}/releases/download/${APP_SLUG}/${APK_NAME}"

          if ! gh release view "$APP_SLUG" --repo "$REPO" >/dev/null 2>&1; then
            echo "::error::No rolling release tagged '${APP_SLUG}'."
            gh release list --repo "$REPO" --limit 20
            exit 1
          fi

          ASSET_COUNT="$(
            gh release view "$APP_SLUG" --repo "$REPO" --json assets \
              --jq "[.assets[] | select(.name == \"${APK_NAME}\")] | length"
          )"

          if [[ "$ASSET_COUNT" -eq 0 ]]; then
            echo "::error::Release '${APP_SLUG}' has no asset named '${APK_NAME}'."
            gh release view "$APP_SLUG" --repo "$REPO" --json assets --jq '.assets[].name'
            exit 1
          fi

          {
            echo "app_slug=$APP_SLUG"
            echo "apk_name=$APK_NAME"
            echo "download_url=$DOWNLOAD_URL"
          } >> "$GITHUB_OUTPUT"

          echo "App: $APP_SLUG"
          echo "Download URL: $DOWNLOAD_URL"

      - name: Generate QR code image
        env:
          DOWNLOAD_URL: ${{ steps.latest.outputs.download_url }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq qrencode
          qrencode -o latest-apk-qr.png -s 10 -m 2 "$DOWNLOAD_URL"
          ls -la latest-apk-qr.png

      - name: Write job summary
        env:
          APP_SLUG: ${{ steps.latest.outputs.app_slug }}
          APK_NAME: ${{ steps.latest.outputs.apk_name }}
          DOWNLOAD_URL: ${{ steps.latest.outputs.download_url }}
        run: |
          set -euo pipefail
          {
            echo "## ${APP_SLUG} development APK"
            echo
            echo "- **Release tag:** \`$APP_SLUG\`"
            echo "- **Asset:** \`$APK_NAME\`"
            echo "- **Download:** $DOWNLOAD_URL"
            echo
            echo "### QR code"
            echo
            echo "Scan with your phone (PNG also attached as a workflow artifact):"
            echo
            echo '```'
            qrencode -t ansiutf8 "$DOWNLOAD_URL"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload QR PNG artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.app_slug }}-dev-app-qr
          path: latest-apk-qr.png
          if-no-files-found: error

name: Cleanup old releases

# Manual only — keeps one rolling release per app slug (e.g. `vyrel`).
# Deletes older tags for that app (`vyrel-*`) without touching other apps.
# Allowed slugs: `.github/app-slugs.txt`
on:
  workflow_dispatch:
    inputs:
      app_slug:
        description: App slot to clean (must be listed in .github/app-slugs.txt)
        required: true
        default: vyrel
        type: string
      delete_legacy_dev_tags:
        description: Also delete legacy timestamp tags like dev-YYYYMMDD-*
        required: true
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  keep-app-slot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app-slugs registry
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/app-slugs.txt
          sparse-checkout-cone-mode: false

      - name: Delete old releases for app slug
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          APP_SLUG: ${{ inputs.app_slug }}
          DELETE_LEGACY: ${{ inputs.delete_legacy_dev_tags }}
        run: |
          set -euo pipefail

          if [[ ! "$APP_SLUG" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "::error::Invalid app_slug: $APP_SLUG"
            exit 1
          fi

          mapfile -t ALLOWED < <(
            grep -E '^[a-z][a-z0-9-]*$' .github/app-slugs.txt || true
          )

          if [[ ${#ALLOWED[@]} -eq 0 ]]; then
            echo "::error::No allowed slugs found in .github/app-slugs.txt"
            exit 1
          fi

          allowed=false
          for slug in "${ALLOWED[@]}"; do
            if [[ "$slug" == "$APP_SLUG" ]]; then
              allowed=true
              break
            fi
          done

          if [[ "$allowed" != "true" ]]; then
            echo "::error::app_slug '$APP_SLUG' is not in .github/app-slugs.txt"
            printf 'Allowed:\n'
            printf '  - %s\n' "${ALLOWED[@]}"
            exit 1
          fi

          KEEP_TAG="$APP_SLUG"
          echo "Keeping rolling release: $KEEP_TAG"

          mapfile -t TAGS < <(
            gh release list --repo "$REPO" --limit 1000 --json tagName --jq '.[].tagName'
          )

          if [[ ${#TAGS[@]} -eq 0 ]]; then
            echo "No releases found."
            exit 0
          fi

          deleted=0
          for TAG in "${TAGS[@]}"; do
            if [[ "$TAG" == "$KEEP_TAG" ]]; then
              continue
            fi

            should_delete=false
            if [[ "$TAG" == "$APP_SLUG"-* ]]; then
              should_delete=true
            fi
            if [[ "$DELETE_LEGACY" == "true" && "$TAG" == dev-* ]]; then
              should_delete=true
            fi

            if [[ "$should_delete" == "true" ]]; then
              echo "Deleting release and tag: $TAG"
              gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
              deleted=$((deleted + 1))
            else
              echo "Skipping (other app or unrelated): $TAG"
            fi
          done

          echo "Done. Kept '$KEEP_TAG'. Deleted $deleted release(s)."

name: Cleanup old releases

# Manual only — for every slug in `.github/app-slugs.txt`, keeps the rolling
# release tag and deletes older tags like `{slug}-*`.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keep-app-slots:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout app-slugs registry
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            .github/app-slugs.txt
          sparse-checkout-cone-mode: false

      - name: Delete old releases for all app slugs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          mapfile -t APP_SLUGS < <(
            grep -E '^[a-z][a-z0-9-]*$' .github/app-slugs.txt || true
          )

          if [[ ${#APP_SLUGS[@]} -eq 0 ]]; then
            echo "::error::No app slugs found in .github/app-slugs.txt"
            exit 1
          fi

          echo "App slots to keep (rolling tags):"
          printf '  - %s\n' "${APP_SLUGS[@]}"

          mapfile -t TAGS < <(
            gh release list --repo "$REPO" --limit 1000 --json tagName --jq '.[].tagName'
          )

          if [[ ${#TAGS[@]} -eq 0 ]]; then
            echo "No releases found."
            exit 0
          fi

          is_keep_tag() {
            local tag="$1"
            local slug
            for slug in "${APP_SLUGS[@]}"; do
              if [[ "$tag" == "$slug" ]]; then
                return 0
              fi
            done
            return 1
          }

          is_app_history_tag() {
            local tag="$1"
            local slug
            for slug in "${APP_SLUGS[@]}"; do
              if [[ "$tag" == "$slug"-* ]]; then
                return 0
              fi
            done
            return 1
          }

          deleted=0
          for TAG in "${TAGS[@]}"; do
            if is_keep_tag "$TAG"; then
              echo "Keeping rolling release: $TAG"
              continue
            fi

            if is_app_history_tag "$TAG"; then
              echo "Deleting release and tag: $TAG"
              gh release delete "$TAG" --repo "$REPO" --yes --cleanup-tag
              deleted=$((deleted + 1))
            else
              echo "Skipping (unrelated): $TAG"
            fi
          done

          echo "Done. Kept rolling tags for ${#APP_SLUGS[@]} app(s). Deleted $deleted release(s)."
